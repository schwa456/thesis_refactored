# Mitigation V5-B — GCNII-style Identity Mapping, L=4
# 근거: planning/DECISIONS.md 2026-05-12 (V5 Mitigation Plan) §V5-B
#       planning/oversmoothing_v5_plan.md §4.2 — "L=2/4/6 sweep" (depth 별 trainability 효과)
# L=4 의 β_l: l=1..4 → β = log(λ/l + 1), λ=0.5
#   β_1 ≈ 0.405, β_2 ≈ 0.223, β_3 ≈ 0.154, β_4 ≈ 0.118 — 깊은 layer 일수록 identity 가 우세.
# Chen 2020 paper 의 주된 evidence 는 L=8, 16, 32 의 deep GNN. 본 schema linking 의 graph 규모 (small/medium
# table) 에서는 L=2/4/6 로 sweep — V5-B 의 trainability 효과가 depth 따라 어떻게 변하는지.

project_name: "Text-to-SQL-Alignment"
experiment_name: "dsn_p80_v5b_gcnii_L4"
checkpoint_name: "best_gat_directed_supernode_p80_v5b_gcnii_L4.pt"

builder:
  type: "EnrichedHeteroGraphBuilder"
  tables_json_path: "/SSL_NAS/peoples/khj/thesis/train/train_tables.json"

paths:
  train_json: "/SSL_NAS/peoples/khj/thesis/train/train.json"
  train_db_dir: "/SSL_NAS/peoples/khj/thesis/train/train_databases"
  test_json: "/home/hyeonjin/thesis_refactored/data/raw/BIRD_dev/dev.json"
  test_db_dir: "/home/hyeonjin/thesis_refactored/data/raw/BIRD_dev/dev_databases"
  checkpoint_dir: "./outputs/checkpoints"
  cache_dir: "./data/processed"

model:
  in_channels: 384
  hidden_channels: 256
  out_channels: 256
  num_layers: 4
  heads: 4
  dropout: 0.1
  classifier_hidden: 256

  query_conditioned: false
  query_supernode: true

  supernode_edge_direction: "directed_from_sn"
  supernode_threshold_mode: "percentile"
  supernode_threshold_value: 80.0
  supernode_score_normalization: "minmax"

  pairnorm_mode: "pairnorm"
  pairnorm_scale: 1.0
  initial_residual_alpha: 0.2
  jumping_knowledge: "concat"
  dual_stream: true

  gat_layer_type: "gcnii"
  gcnii_beta_lambda: 0.5
  aggregation_type: "mean"

training:
  epochs: 300
  batch_size: 8
  learning_rate: 0.0001
  weight_decay: 0.00001
  pos_weight: 100.0
  val_split: 0.1
  recall_k: 15
  loss_type: "listnet"
  anti_collapse_weight: 0.1
  anti_collapse_tau_max: 0.85
