# Direction B HN-SupCon — anchor pipeline 의 selector 만 HN-SupCon backbone 으로 교체
# 근거: planning/DECISIONS.md 2026-05-14 (학술 Agent Phase 5 §4 Direction B HN-SupCon Spec)
#       planning/filter_proposal_by_scholar_agent_phase5_2026-05-14.md §3.1~§3.5
#
# 학술 frame (학술 Agent Phase 5 §0): "Filter-Invariant 경계 확정 실험" — EX 개선 아닌
# Filter-Invariant boundary 확정 evidence. Direction B null result = EX 가 precision 개선에도
# invariant (Filter-Invariant 의 추가 boundary evidence).
#
# Anchor framework 정합 (학술 Agent Phase 5 §4.5):
#   - Builder/Extractor/Filter/SQL Gen — anchor 와 동일 (`s04_pipeline_enriched_qcond_a05_mst_kruskal_glm`)
#   - Selector 만 HN-SupCon fine-tuned encoder 로 교체 (alpha=0.5 + top_k=20 + GAT projector 유지)
#
# Prerequisite: src/train_hn_supcon.py 학습 완료 → outputs/checkpoints/hn_supcon/ 에 SentenceTransformer ckpt
#
# vs baseline (anchor F1=0.8667 EX=0.5202) 비교 — EX precision-invariance 검증.

experiment_name: "b06_01_hn_supcon_glm"

graph_builder:
  name: "EnrichedHeteroGraphBuilder"
  params:
    include_views: false
    run_leiden_clustering: true
    tables_json_path: "data/raw/BIRD_dev/dev_tables.json"

# Pipeline-level NLQ encoder 도 HN-SupCon fine-tuned backbone 으로 교체 (raw cosine 경로 정합).
# HN-SupCon ckpt 미존재 시 anchor backbone 자동 fallback.
nlq_encoder:
  name: "LocalPLMEncoder"
  params:
    model_name: "outputs/checkpoints/hn_supcon"

projection:
  enabled: false

seed_selector:
  name: "HNSupConSelector"
  params:
    # GAT projector ckpt — anchor 와 동일 (encoder 만 교체, projector 학습 ckpt 그대로)
    weight_path: "outputs/checkpoints/best_gat_qcond_nl3.pt"
    # HN-SupCon fine-tuned encoder path (학습 후 SentenceTransformer save 결과)
    hn_supcon_ckpt_path: "outputs/checkpoints/hn_supcon"
    alpha: 0.5
    top_k: 20
    query_conditioned: true
    encoder_type: "plm"

connectivity_extractor:
  name: "MSTKruskalExtractor"
  params:
    score_threshold: 0.1

filter:
  name: "XiYanFilter"
  params:
    provider: "glm"
    model_name: "zai-org/glm-4.7"
    max_iteration: 1
    temperature: 0.0

post_processing:
  auto_join_keys: true

sql_generator:
  enabled: false
