# Wave 6 Phase 2 (a) — M2 CoT + Confidence-Gated + M1 best (strong) 조합
# DECISIONS 2026-05-16 (Wave 6 Phase 1 M1 결과 채택 + Phase 2 (a) 분기 활성 결정) §2 Phase 2 (a) Spec
# 학술 agent filter improve plan §3.3 Phase 2 분기 + §4 M2 CoT spec
# Module:Filter commit 7dac875 (XiYanFilter cot_reasoning + confidence_gated + confidence_threshold)
#
# Spec (analyzer §5.2):
# - base: anchor c01_01 stack (Enriched + QCondGAT + bidirectional SN + MSTPCSTUnion + GLM 4.7 + SQL gen)
# - M1 best (recall_biased_strong, Phase 1 F1=0.8655 sub-noise + ΔR=+0.0274)
# - M2 CoT prompt — column 별 confidence ∈ [0,1] explicit output
# - Confidence-Gated: confidence > threshold(0.5) 인 column 만 prune
#
# Expected outcomes:
# - R_fil ≥ strong baseline 0.9022 (M1 base R lift retain)
# - P_fil ≥ strong baseline 0.8316 + Confidence-Gated P recovery
# - F1_fil > 0.8672 (학술 agent §10 success criterion 통계 검증 candidate)
#
# Cost: 2 LLM call/q × 1534q = 3068 calls, ~$2-4 GLM 4.7, ~1.7h wall

experiment_name: "w6_p2a_m2cot_strong"

graph_builder:
  name: "EnrichedHeteroGraphBuilder"
  params:
    include_views: false
    run_leiden_clustering: true
    tables_json_path: "data/raw/BIRD_dev/dev_tables.json"

nlq_encoder:
  name: "LocalPLMEncoder"
  params:
    model_name: "sentence-transformers/all-MiniLM-L6-v2"

projection:
  enabled: false

seed_selector:
  name: "EnsembleSelector"
  params:
    weight_path: "outputs/checkpoints/best_gat_qcond_nl3.pt"
    alpha: 0.5
    top_k: 20
    query_conditioned: true
    encoder_type: "plm"

connectivity_extractor:
  name: "MSTPCSTUnionExtractor"
  params:
    score_threshold: 0.1

filter:
  name: "XiYanFilter"
  params:
    provider: "glm"
    model_name: "zai-org/glm-4.7"
    max_iteration: 1
    temperature: 0.0
    prompt_mode: "recall_biased_strong"
    cot_reasoning: true
    confidence_gated: true
    confidence_threshold: 0.5
    sanitize_output: true

post_processing:
  auto_join_keys: true

sql_generator:
  enabled: true
  name: "LLMSQLGenerator"
  params:
    provider: "glm"
    llm_model: "zai-org/glm-4.7"
    temperature: 0.0
